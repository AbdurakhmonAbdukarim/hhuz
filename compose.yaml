services:
  hhuz.web:
    image: hhuz.web
    build:
      context: .
      dockerfile: hhuz.web/Dockerfile

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hhuz_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: